<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- A안: 마이크 + 텍스트 커서 — "말하면 입력된다" -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8DFF"/>
      <stop offset="1" stop-color="#6B4CF6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <g fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round">
    <rect x="360" y="262" width="140" height="300" rx="70" fill="#fff" stroke="none"/>
    <path d="M290 480 a140 140 0 0 0 280 0"/>
    <path d="M430 622 V700"/>
    <path d="M368 720 H492"/>
  </g>
  <g fill="none" stroke="#CFE4FF" stroke-width="34" stroke-linecap="round">
    <path d="M706 300 V724"/>
    <path d="M652 300 H760"/>
    <path d="M652 724 H760"/>
  </g>
</svg>
