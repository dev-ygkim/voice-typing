<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="920" height="560" fill="#ffffff"/>

  <!-- Mac 내부 경계 -->
  <rect x="20" y="20" width="700" height="520" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="40" y="48" font-size="15" font-weight="700" fill="#334155">Mac 내부 · 음성과 텍스트는 밖으로 나가지 않음</text>

  <!-- 사용자 -->
  <rect x="40" y="80" width="150" height="86" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text x="115" y="110" font-size="15" font-weight="700" fill="#9a3412" text-anchor="middle">🎙 말하기</text>
  <text x="115" y="132" font-size="12" fill="#9a3412" text-anchor="middle">한국어 + 영어 용어</text>
  <text x="115" y="150" font-size="12" fill="#9a3412" text-anchor="middle">내장 마이크 · 블루투스 이어폰</text>

  <!-- 앱 -->
  <rect x="220" y="64" width="480" height="356" rx="12" fill="#eef2ff" stroke="#6366f1"/>
  <text x="240" y="90" font-size="15" font-weight="700" fill="#3730a3">Voice Typing.app (메뉴바 전용)</text>

  <rect x="240" y="104" width="440" height="58" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="256" y="127" font-size="13" font-weight="700" fill="#1e1b4b">PopoverView · 메뉴바 🎙 창</text>
  <text x="256" y="148" font-size="12" fill="#4338ca">모델 내려받기 버튼 · 실시간 글자(회색=바뀔 수 있음) · 복사+붙여넣기</text>

  <rect x="240" y="176" width="210" height="108" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="256" y="199" font-size="13" font-weight="700" fill="#1e1b4b">Transcriber</text>
  <text x="256" y="220" font-size="12" fill="#4338ca">마이크 캡처 (AVAudioEngine)</text>
  <text x="256" y="239" font-size="12" fill="#4338ca">16kHz 로 변환해 모으기</text>
  <text x="256" y="258" font-size="12" fill="#4338ca">1초마다 다시 받아쓰기</text>
  <text x="256" y="277" font-size="12" fill="#4338ca">마이크 형식 전환 시 재연결</text>

  <rect x="470" y="176" width="210" height="108" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="486" y="199" font-size="13" font-weight="700" fill="#064e3b">SpeechModel (WhisperKit)</text>
  <text x="486" y="220" font-size="12" fill="#047857">Whisper large-v3-turbo</text>
  <text x="486" y="239" font-size="12" fill="#047857">Core ML · Neural Engine</text>
  <text x="486" y="258" font-size="12" fill="#047857">한국어 고정 + 영어 용어 힌트</text>
  <text x="486" y="277" font-size="12" fill="#047857">~/Library/Application Support</text>

  <rect x="240" y="298" width="210" height="70" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="256" y="321" font-size="13" font-weight="700" fill="#1e1b4b">TranscriptBuffer</text>
  <text x="256" y="342" font-size="12" fill="#4338ca">확정 글자 + 미확정 글자</text>
  <text x="256" y="359" font-size="12" fill="#4338ca">이어쓰기 · 직접 수정</text>

  <rect x="470" y="298" width="210" height="70" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="486" y="321" font-size="13" font-weight="700" fill="#1e1b4b">Paster</text>
  <text x="486" y="342" font-size="12" fill="#4338ca">마지막 사용 앱 기억</text>
  <text x="486" y="359" font-size="12" fill="#4338ca">클립보드 복사 → ⌘V 전송</text>

  <text x="240" y="400" font-size="12" fill="#64748b">테스트: 변환·무음 판정·장치 전환·버퍼·붙여넣기는 단위 테스트, 실제 모델은 통합 테스트</text>

  <!-- 결과 -->
  <rect x="220" y="440" width="480" height="80" rx="10" fill="#f0f9ff" stroke="#0ea5e9"/>
  <text x="240" y="468" font-size="14" font-weight="700" fill="#075985">터미널 · Claude Code 입력창</text>
  <text x="240" y="492" font-size="12" fill="#0369a1">받아쓴 글자가 붙여넣어짐 · Enter 는 직접 누름 (실수로 전송되지 않게)</text>

  <!-- 외부: 모델 다운로드 -->
  <rect x="745" y="176" width="155" height="108" rx="10" fill="#fefce8" stroke="#eab308" stroke-dasharray="5 3"/>
  <text x="822" y="204" font-size="13" font-weight="700" fill="#854d0e" text-anchor="middle">Hugging Face</text>
  <text x="822" y="226" font-size="12" fill="#a16207" text-anchor="middle">처음 한 번만</text>
  <text x="822" y="245" font-size="12" fill="#a16207" text-anchor="middle">모델 내려받기</text>
  <text x="822" y="264" font-size="12" fill="#a16207" text-anchor="middle">(약 1.6GB)</text>

  <!-- 화살표 -->
  <path d="M190,123 L238,212" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="196" y="186" font-size="11" fill="#475569">소리</text>
  <path d="M450,230 L468,230" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M575,284 L575,292 L345,292 L345,296" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="590" y="294" font-size="11" fill="#475569">받아쓴 글자</text>
  <path d="M240,333 L230,333 L230,133 L238,133" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M575,368 L575,438" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M743,230 L682,230" stroke="#ca8a04" stroke-width="1.6" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 3"/>
</svg>
